<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>อาหารเพื่อสุขภาพและความงาม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#40362F;--a:#C89B6D;--soft:#F8F4EF;--line:#EADFD2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--soft);font-family:'Google Sans','Noto Sans Thai',system-ui,sans-serif;color:var(--p);display:flex;align-items:center;justify-content:center;padding-bottom:64px;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ---------- stage 16:9 ---------- */
.stage{position:relative;width:min(96vw,calc((100dvh - 84px) * 16 / 9));aspect-ratio:16/9;container-type:size}
.slide{position:absolute;inset:0;background:#fff;border-radius:2.4cqw;box-shadow:0 .4cqw 2cqw rgba(64,54,47,.10),0 .1cqw .3cqw rgba(64,54,47,.06);overflow:hidden;display:none;flex-direction:column;padding:4.2cqw 4.6cqw 5.8cqw}
.slide.active{display:flex}
.slide::before{content:"";position:absolute;width:30cqw;height:30cqw;border-radius:50%;background:var(--soft);right:-9cqw;top:-12cqw}
.slide>*{position:relative}

.tag{position:absolute;left:4.6cqw;top:3.6cqw;display:inline-flex;align-items:center;gap:.6cqw;padding:.55cqw 1.5cqw;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:1.25cqw;font-weight:700;z-index:2}
.tag::before{content:"";width:.7cqw;height:.7cqw;border-radius:50%;background:var(--a)}
.pg{position:absolute;right:4.6cqw;bottom:2.2cqw;font-size:1.3cqw;font-weight:800;padding:.4cqw 1.3cqw;border-radius:99px;background:var(--soft);border:1px solid var(--line)}
.pg span{font-weight:500;opacity:.55}
.brand{position:absolute;left:4.6cqw;bottom:2.5cqw;font-size:1.1cqw;font-weight:500;opacity:.55}

/* ---------- type ---------- */
h1,h2{font-weight:800;line-height:1.35;letter-spacing:-.01em}
h2{font-size:3.5cqw}
.grad{background:linear-gradient(100deg,#C89B6D 0%,#8A6240 55%,#40362F 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sub{font-size:1.7cqw;line-height:1.55;color:rgba(64,54,47,.72);margin-top:.5cqw}

/* ---------- icons ---------- */
.ic{display:grid;place-items:center;flex:none;width:var(--s,5cqw);height:var(--s,5cqw);border-radius:50%;background:var(--cc,var(--p));transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 .3cqw .8cqw rgba(64,54,47,.18)}
.ic svg{width:52%;height:52%;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic:hover{transform:scale(1.14)}

/* ---------- shades ---------- */
.d{background:var(--p);color:#fff;--cc:var(--a)}
.d p{color:rgba(255,255,255,.85)}
.m{background:var(--a);color:var(--p)}
.m p{color:rgba(64,54,47,.92)}
.l{background:var(--soft);border:1px solid var(--line)}
.l p{color:rgba(64,54,47,.8)}
.n{position:absolute;right:1.8cqw;top:1.4cqw;font-size:1.8cqw;font-weight:800;opacity:.3}

/* ---------- cards layout ---------- */
.hd{margin-top:5cqw;display:flex;align-items:center;justify-content:space-between;gap:3cqw}
.hd .ic{--s:8.4cqw}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-top:2.8cqw;flex:1;min-height:0}
.card{position:relative;border-radius:1.8cqw;padding:2.3cqw 2.2cqw;display:flex;flex-direction:column;gap:1cqw}
.card .ic{--s:5.6cqw}
.card h3{font-size:2.15cqw;font-weight:800;line-height:1.35;margin-top:.8cqw}
.card p{font-size:1.65cqw;line-height:1.55}

/* ---------- rows layout ---------- */
.rl{flex:1;display:grid;grid-template-columns:36fr 64fr;gap:3cqw;margin-top:5cqw;min-height:0}
.left{display:flex;flex-direction:column;min-height:0}
.left h2{font-size:3.2cqw}
.panel{margin-top:2.2cqw;flex:1;min-height:0;border-radius:1.8cqw;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;width:19cqw;height:19cqw;border-radius:50%;border:.25cqw dashed var(--a);opacity:.7}
.panel .ic{--s:9.5cqw;position:relative}
.panel svg.plate{height:90%;width:auto;position:relative}
.right{display:flex;flex-direction:column;gap:1.8cqw;min-height:0}
.row{flex:1;position:relative;border-radius:1.8cqw;padding:1.4cqw 2.4cqw;display:flex;align-items:center;gap:2cqw;min-height:0}
.row .ic{--s:6cqw}
.row h3{font-size:2cqw;font-weight:800;line-height:1.35}
.row p{font-size:1.6cqw;line-height:1.5;margin-top:.2cqw}

/* ---------- cover ---------- */
.slide.cover.active{display:grid;grid-template-columns:57fr 43fr;gap:2cqw;align-items:center}
.cover::before{width:44cqw;height:44cqw;right:-12cqw;top:-16cqw}
.cover h1{font-size:5.2cqw;line-height:1.3}
.cover .lead{font-size:2cqw;line-height:1.55;color:rgba(64,54,47,.75);margin-top:1.4cqw}
.who{display:flex;align-items:center;gap:1.6cqw;margin-top:3.4cqw}
.who .ic{--s:6cqw}
.who small{display:block;font-size:1.3cqw;opacity:.65}
.who b{font-size:2.1cqw;font-weight:800}
.chip{display:inline-block;margin-top:2cqw;padding:.8cqw 1.8cqw;border-radius:99px;background:var(--p);color:#fff;font-size:1.4cqw;font-weight:600}
.art{position:relative;width:100%;aspect-ratio:1;max-height:44cqw;justify-self:center}
.art .ring{position:absolute;left:50%;top:50%;width:76%;height:76%;transform:translate(-50%,-50%);border-radius:50%;border:.28cqw dashed var(--a)}
.art .ic{position:absolute}
.art .big{--s:19cqw;left:50%;top:50%;margin:-9.5cqw 0 0 -9.5cqw}
.art .s1{--s:9cqw;--cc:var(--a);left:6%;top:8%}
.art .s2{--s:8cqw;right:6%;top:12%}
.art .s3{--s:8.4cqw;--cc:var(--a);left:2%;bottom:14%}
.art .s4{--s:9cqw;right:4%;bottom:8%}

/* ---------- animation ---------- */
@keyframes rise{from{opacity:0;transform:translateY(3.2cqw)}to{opacity:1;transform:none}}
.slide.active .rise{animation:rise .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * .13s + .05s)}
@media (prefers-reduced-motion:reduce){.slide.active .rise{animation:none}}

/* ---------- nav ---------- */
.bar{position:fixed;left:0;top:0;height:4px;background:linear-gradient(90deg,#C89B6D,#40362F);transition:width .35s;z-index:5}
.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 10px;box-shadow:0 4px 18px rgba(64,54,47,.12);z-index:5}
.nav button{width:38px;height:38px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;transition:transform .2s,opacity .2s;font-family:inherit}
.nav button:hover{transform:scale(1.1)}
.nav button:disabled{opacity:.3;cursor:default;transform:none}
.nav button.fs{background:var(--soft);color:var(--p);border:1px solid var(--line);font-size:15px}
.nav .cnt{min-width:64px;text-align:center;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<main class="stage" id="stage"></main>
<nav class="nav" aria-label="ควบคุมสไลด์">
  <button id="prev" aria-label="หน้าก่อนหน้า">&#8592;</button>
  <span class="cnt" id="cnt">1 / 20</span>
  <button id="next" aria-label="หน้าถัดไป">&#8594;</button>
  <button class="fs" id="fs" aria-label="เต็มหน้าจอ">&#9974;</button>
</nav>

/* ---------- สร้างสไลด์ ---------- */
const TOTAL=D.length, pad=n=>String(n).padStart(2,'0');
const SH=['d','m','l'];
const sh=(k,i)=>SH[(k+i)%3];
const title=t=>`${t[0]} <span class="grad">${t[1]}</span>`;
const foot=(s,i)=>`<div class="brand">${s.foot||BRAND}</div><div class="pg">${pad(i+1)} <span>/ ${TOTAL}</span></div>`;

function plateSVG(){
  // 3 ส่วน: ผักผลไม้ 50, โปรตีน 25, ข้าว-แป้ง 25 (เว้นช่องไฟขาว)
  const seg=(len,off,c)=>`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${c}" stroke-width="9" stroke-dasharray="${len-1} ${100-len+1}" stroke-dashoffset="${-off}" transform="rotate(-90 21 21)"/>`;
  return `<svg class="plate" viewBox="0 0 42 42" role="img" aria-label="จานสุขภาพ ผักผลไม้ครึ่งจาน โปรตีนหนึ่งในสี่ ข้าวแป้งหนึ่งในสี่">
  <circle cx="21" cy="21" r="20" fill="#fff" stroke="#EADFD2" stroke-width=".5"/>
  ${seg(50,0,'#C89B6D')}${seg(25,50,'#40362F')}${seg(25,75,'#8A6A4B')}
  <circle cx="21" cy="21" r="9" fill="#fff"/>
  <text x="21" y="22.4" text-anchor="middle" font-size="3.4" font-weight="800" fill="#40362F" font-family="Noto Sans Thai,sans-serif">2 : 1 : 1</text></svg>`;
}

function cover(s,i){
  return `<section class="slide cover">
  <div class="tag rise" style="--i:0">${s.tag}</div>
  <div>
    <h1 class="rise" style="--i:1">อาหารเพื่อ<br><span class="grad">สุขภาพและความงาม</span></h1>
    <p class="lead rise" style="--i:2">กินให้ถูก ร่างกายดี ผิวพรรณก็ดีตามมา</p>
    <div class="who rise" style="--i:3">${ic('user')}<div><small>นำเสนอโดย</small><b>อาจารย์นพมาศ ร่มเกตุ</b></div></div>
    <span class="chip rise" style="--i:4">สำหรับนักศึกษาปริญญาตรีชั้นปีที่ 1</span>
  </div>
  <div class="art rise" style="--i:2">
    <div class="ring"></div>
    ${ic('leaf','','big')}${ic('apple','','s1')}${ic('sparkles','','s2')}${ic('drop','','s3')}${ic('heart','','s4')}
  </div>
  ${foot(s,i)}</section>`;
}

function cards(s,i){
  return `<section class="slide">
  <div class="tag rise" style="--i:0">${s.tag}</div>
  <header class="hd rise" style="--i:1"><div><h2>${title(s.t)}</h2><p class="sub">${s.sub}</p></div>${ic(s.icon)}</header>
  <div class="cards">${s.items.map((it,k)=>`
    <article class="card ${sh(k,i)} rise" style="--i:${k+2}">
      <span class="n">${pad(k+1)}</span>${ic(it[0])}<h3>${it[1]}</h3><p>${it[2]}</p>
    </article>`).join('')}</div>
  ${foot(s,i)}</section>`;
}

function rows(s,i,plate){
  const visual=plate?plateSVG():ic(s.icon);
  return `<section class="slide">
  <div class="tag rise" style="--i:0">${s.tag}</div>
  <div class="rl">
    <div class="left">
      <div class="rise" style="--i:1"><h2>${title(s.t)}</h2><p class="sub">${s.sub}</p></div>
      <div class="panel rise" style="--i:2">${visual}</div>
    </div>
    <div class="right">${s.items.map((it,k)=>`
      <article class="row ${plate?'l':sh(k,i)} rise" style="--i:${k+2}">
        <span class="n">${pad(k+1)}</span>${ic(it[0],it[3]?`--cc:${it[3]}`:'')}
        <div><h3>${it[1]}</h3><p>${it[2]}</p></div>
      </article>`).join('')}</div>
  </div>
  ${foot(s,i)}</section>`;
}

const stage=document.getElementById('stage');
stage.innerHTML=D.map((s,i)=>s.lay==='cover'?cover(s,i):s.lay==='cards'?cards(s,i):rows(s,i,s.lay==='plate')).join('');
const S=[...stage.querySelectorAll('.slide')];

/* ---------- การนำทาง ---------- */
const bar=document.getElementById('bar'),cnt=document.getElementById('cnt'),prev=document.getElementById('prev'),next=document.getElementById('next');
let cur=0;
function go(n,push=true){
  n=Math.max(0,Math.min(TOTAL-1,n));
  S[cur].classList.remove('active');cur=n;S[cur].classList.add('active');
  cnt.textContent=`${cur+1} / ${TOTAL}`;
  bar.style.width=((cur+1)/TOTAL*100)+'%';
  prev.disabled=cur===0;next.disabled=cur===TOTAL-1;
  if(push)try{history.replaceState(null,'','#'+(cur+1))}catch(e){}
}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
document.getElementById('fs').onclick=()=>{
  if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
};
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(e.key==='Home')go(0);else if(e.key==='End')go(TOTAL-1);
  else if(e.key==='f'||e.key==='F')document.getElementById('fs').click();
});
let tx=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1));tx=null});
const h=parseInt(location.hash.slice(1),10);
go(isNaN(h)?0:h-1,false);
</script>
